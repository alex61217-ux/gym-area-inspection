if($('localAdd'))$('localAdd').onclick=async()=>{const b=$('localAdd');b.disabled=true;try{const current=cases.find(x=>x.id===c.id);if(!alive()||!mayAddPhoto(current))throw Error('案件權限或狀態已改變');const files=[...$('localCamera').files,...$('localGallery').files],kind=$('localKind').value;if(!files.length)throw Error('請先拍照或選擇照片');const existing=(await localRead(owner)).filter(p=>p.caseId===c.id);if(existing.length+files.length>20)throw Error('每個帳號每案最多暫存 20 張');if(!confirm('請確認照片未拍到會員或個資，並僅供公司巡檢使用。'))return;const records=[];for(const [i,file] of files.entries()){feedback(`壓縮中 ${i+1}/${files.length}`);const blob=await compressPhoto(file),id=crypto.randomUUID();records.push({id,owner,caseId:c.id,date:c.date,kind,name:photoName(c,kind,id),at:new Date().toISOString(),blob})}if(!alive()||!mayAddPhoto(cases.find(x=>x.id===c.id)))throw Error('案件權限或狀態已改變');await localWrite(records);if(!alive())return;$('localCamera').value='';$('localGallery').value='';await refresh();feedback(`已暫存 ${records.length} 張照片；請按儲存至裝置或分享。`)}catch(e){feedback('未完成：'+e.message+'。HEIC 若無法解碼，請改用 JPEG 格式。')}finally{if(alive())b.disabled=false}};await refresh()}
$('modal').addEventListener('close',()=>{photoSession++;$('modalForm').querySelector('[type=submit]').hidden=false;clearPhotoUrls();$('fields').replaceChildren()});
function renderDashboard(){const total=allItems().length,done=allItems().filter(i=>effective(i.id)!=='pending').length;const metrics=[['當日完成',`${done}/${total}`],['待改善',cases.filter(c=>['open','working'].includes(c.stage)).length],['待複查',cases.filter(c=>c.stage==='review').length],['逾期',cases.filter(overdue).length]];$('view').innerHTML=`<section><h2>主管總覽</h2><div class="tiles">${metrics.map(([n,v])=>`<div class="tile">${n}<b>${v}</b></div>`).join('')}</div></section><section><h3>區域進度</h3>${[...new Set(allItems().map(i=>i.tab))].map(t=>{const a=allItems().filter(i=>i.tab===t),n=a.filter(i=>effective(i.id)!=='pending').length;return `<p>${esc(t)} ${n}/${a.length}<progress value="${n}" max="${a.length}"></progress></p>`}).join('')}</section>`}
let tplSearch='';function renderTemplates(){const items=templateItems().filter(i=>[i.tab,i.category,i.area,i.item].join(' ').includes(tplSearch));$('view').innerHTML=`<section><h2>巡檢項目設定</h2><p>修改僅影響新建立日期，既有巡檢快照不變。</p><div class="line"><input id="tplSearch" placeholder="搜尋" value="${esc(tplSearch)}"><button id="addItem">新增項目</button></div></section><section>${items.map(i=>`<div class="item"><strong>${esc(i.item)}</strong><span class="muted">${esc(i.tab)} · ${esc(i.category)} · ${esc(i.frequency)} · ${i.active?'啟用':'停用'}</span> <button data-template="${esc(i.id)}">修改</button></div>`).join('')}</section>`;$('tplSearch').onchange=e=>{tplSearch=e.target.value;render()};$('addItem').onclick=()=>editTemplate();$('view').querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>editTemplate(items.find(i=>i.id===b.dataset.template)))}
function editTemplate(i={id:crypto.randomUUID(),tab:'',area:'',category:'',item:'',frequency:'daily',active:true}){modal('巡檢項目設定',`${[['tab','分區'],['area','區域'],['category','種類'],['item','檢查細項']].map(([k,l])=>`<label>${l}<input name="${k}" value="${esc(i[k])}" ${k==='area'?'':'required'}></label>`).join('')}<label>頻率<select name="frequency">${options({daily:'每日',weekly:'每週一',monthly:'每月1日'},i.frequency)}</select></label><label><input type="checkbox" name="active" ${i.active?'checked':''}>啟用</label>`,async f=>{await setDoc(D('templates',i.id),{tab:f.get('tab').trim(),area:f.get('area').trim(),category:f.get('category').trim(),item:f.get('item').trim(),frequency:f.get('frequency'),active:f.has('active')})})}
function renderPeople(){ $('view').innerHTML=`<section><h2>人員責任區域</h2><p>先在 Firebase Authentication 建立帳號，再用 UID 建立對應人員資料。</p><button id="addPerson">新增人員資料</button></section><section>${people.map(p=>`<div class="item"><strong>${esc(p.name)}｜${esc(p.role)}｜${p.active?'啟用':'停用'}</strong><p>${esc((p.areas||[]).join('、'))}</p><button data-person="${esc(p.id)}">編輯</button></div>`).join('')}</section>`;$('addPerson').onclick=()=>editPerson();$('view').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>editPerson(people.find(p=>p.id===b.dataset.person)))}
function editPerson(p={id:'',name:'',role:'staff',active:true,areas:[]}){const areas=[...new Set(templateItems().map(i=>i.tab))];modal('人員資料',`<label>Authentication UID<input name="uid" required value="${esc(p.id)}" ${p.id?'readonly':''}></label><label>姓名<input name="name" required value="${esc(p.name)}"></label><label>角色<select name="role">${options({staff:'員工',manager:'主管'},p.role)}</select></label><label><input type="checkbox" name="active" ${p.active?'checked':''}>啟用</label>${areas.map(a=>`<label><input type="checkbox" name="areas" value="${esc(a)}" ${p.areas?.includes(a)?'checked':''}>${esc(a)}</label>`).join('')}`,async f=>{const uid=f.get('uid').trim();if(uid===user.uid)throw Error('不可修改自己的主管權限');if(uid.includes('/'))throw Error('UID 格式錯誤');await setDoc(D('users',uid),{name:f.get('name').trim(),role:f.get('role'),active:f.has('active'),areas:f.getAll('areas')})})}
let reportFrom=shift(today(),-6),reportTo=today();function renderReports(){const rows=reportRows; $('view').innerHTML=`<section><h2>歷史報表</h2><div class="line no-print"><button id="week">近7天</button><button id="month">本月</button><input id="from" type="date" value="${reportFrom}"><input id="to" type="date" value="${reportTo}"><button id="report">查詢</button><button id="excel" ${rows.length?'':'disabled'}>Excel</button><button id="csv" ${rows.length?'':'disabled'}>CSV</button><button id="pdf" ${rows.length?'':'disabled'}>列印／存 PDF</button></div><p>${esc(reportSummary)}</p></section><section style="overflow:auto"><table><thead><tr>${['日期','分區','區域','種類','項目','狀態','巡檢人','備註'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,500).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><p>畫面最多顯示 500 筆；Excel 含全部查詢結果。</p></section>`;$('week').onclick=()=>{reportFrom=shift(today(),-6);reportTo=today();render()};$('month').onclick=()=>{reportFrom=today().slice(0,7)+'-01';reportTo=today();render()};$('report').onclick=task(async()=>{reportFrom=$('from').value;reportTo=$('to').value;await buildReport()});$('excel').onclick=task(exportExcel);$('csv').onclick=exportCsv;$('pdf').onclick=()=>{const w=window.open('','_blank');if(!w){msg('請允許彈出視窗',true);return}w.document.write(`<html lang="zh-Hant"><meta charset="utf-8"><title>巡檢報表</title><style>body{font:12px sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:4px}thead{display:table-header-group}tr{break-inside:avoid}</style><h1>環境巡檢報表</h1><p>${esc(reportSummary)}</p><table><thead><tr>${['日期','分區','區域','種類','項目','狀態','巡檢人','備註'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></html>`);w.document.close();w.print()}}
async function buildReport(){if(!reportFrom||!reportTo||reportTo<reportFrom||dateObj(reportTo)-dateObj(reportFrom)>31*86400000)throw Error('請選擇最多 32 日的有效區間');msg('正在讀取歷史紀錄');const s=await getDocs(query(C('runs'),where('date','>=',reportFrom),where('date','<=',reportTo)));const rows=[];const seen=new Set();for(const r of s.docs){seen.add(r.id);const a=r.data(),es=await getDocs(EC(r.id)),m=Object.fromEntries(es.docs.map(e=>[e.id,e.data()]));for(const i of a.items.filter(allowed)){const e=m[i.id]||a.legacyEntries?.[i.id]||{};rows.push([r.id,i.tab,i.area,i.category,i.item,labels[e.status||'pending'],e.inspector||'',e.note||''])}}for(let d=reportFrom;d<=reportTo;d=shift(d,1)){if(seen.has(d))continue;const l=await getDoc(old(d));if(!l.exists())continue;const a=l.data();for(const i of ORIGINAL.filter(allowed)){const e=legacyEntry(a.entries?.[i.id]||{},a.inspector);rows.push([d,i.tab,i.area,i.category,i.item,labels[e.status],e.inspector,e.note])}}reportRows=rows.sort((a,b)=>a[0].localeCompare(b[0]));const done=rows.filter(r=>r[5]!=='未檢查').length,issues=rows.filter(r=>r[5]==='異常').length,by={};rows.filter(r=>r[5]==='異常').forEach(r=>by[r[1]]=(by[r[1]]||0)+1);reportSummary=`${reportFrom} 至 ${reportTo}｜完成 ${done}/${rows.length} (${rows.length?Math.round(done/rows.length*100):0}%)｜異常 ${issues}｜區域異常：${Object.entries(by).map(([k,v])=>k+' '+v).join('、')||'無'}`;msg('報表已產生');render()}
async function exportExcel(){if(!window.ExcelJS)throw Error('Excel 元件未載入');const wb=new ExcelJS.Workbook(),summary=wb.addWorksheet('統計'),sheet=wb.addWorksheet('巡檢明細');summary.addRow([reportSummary]);sheet.addRow(['日期','分區','區域','種類','項目','狀態','巡檢人','備註']);reportRows.forEach(r=>sheet.addRow(r));sheet.getRow(1).font={bold:true};sheet.views=[{state:'frozen',ySplit:1}];sheet.columns.forEach((c,i)=>c.width=[13,22,22,20,45,12,18,45][i]);const buf=await wb.xlsx.writeBuffer(),url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download='巡檢報表_'+reportFrom+'_'+reportTo+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
setInterval(()=>{if(profile&&(page==='異常管理'||page==='主管總覽'))repaint()},60000);

function exportCsv(){const safe=x=>{let v=String(x??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};const data=[['日期','分區','區域','種類','項目','狀態','巡檢人','備註'],...reportRows].map(r=>r.map(safe).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\uFEFF',data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='巡檢報表.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
</script></body></html>
