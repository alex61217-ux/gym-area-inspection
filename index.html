    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function nowTimeString() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function showToast(msg) {
      els.toastBox.textContent = msg;
      els.toastBox.classList.remove("opacity-0");
      els.toastBox.classList.add("opacity-100");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        els.toastBox.classList.remove("opacity-100");
        els.toastBox.classList.add("opacity-0");
      }, 1800);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function localStorageKey(dateStr) {
      return `${APP_ID}_${dateStr}`;
    }

    function loadLocal(dateStr) {
      try {
        const raw = localStorage.getItem(localStorageKey(dateStr));
        if (!raw) return { inspector: "", entries: {}, updatedAt: "" };
        const parsed = JSON.parse(raw);
        return {
          inspector: parsed.inspector || "",
          entries: parsed.entries || {},
          updatedAt: parsed.updatedAt || ""
        };
      } catch {
        return { inspector: "", entries: {}, updatedAt: "" };
      }
    }

    function saveLocal(dateStr) {
      try {
        localStorage.setItem(localStorageKey(dateStr), JSON.stringify({
          inspector: state.inspector,
          entries: state.entries,
          updatedAt: state.updatedAt
        }));
      } catch {}
    }

    function setSyncBadge(mode, text) {
      els.syncStatus.textContent = text;
      els.syncDot.className = "inline-block w-2 h-2 rounded-full " + (
        mode === "ok" ? "bg-emerald-500" :
        mode === "warn" ? "bg-amber-400" : "bg-rose-500"
      );
    }

    async function initFirebase() {
      const hasConfig = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
      if (!hasConfig) {
        setSyncBadge("warn", "本機儲存模式（請填入 firebaseConfig 啟用雲端同步）");
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        state.db = getFirestore(app);
        await signInAnonymously(auth);
        state.cloudReady = true;
        setSyncBadge("ok", "雲端已即時同步");
        subscribeDate(state.date);
      } catch (err) {
        console.error("Firebase init error:", err);
        setSyncBadge("err", "雲端連線失敗（已改用本機暫存）");
      }
    }

    function subscribeDate(dateStr) {
      if (typeof state.unsubscribe === "function") {
        state.unsubscribe();
        state.unsubscribe = null;
      }

      const localData = loadLocal(dateStr);
      state.inspector = localData.inspector;
      state.entries = localData.entries;
      state.updatedAt = localData.updatedAt;
      els.inspectorInput.value = state.inspector;
      renderAll();

      if (!state.cloudReady || !state.db) return;

      const docRef = doc(state.db, "artifacts", APP_ID, "public", "data", "areaInspections", dateStr);
      state.unsubscribe = onSnapshot(docRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          state.inspector = data.inspector || "";
          state.entries = data.entries || {};
          state.updatedAt = data.updatedAt || "";
          if (document.activeElement !== els.inspectorInput) {
            els.inspectorInput.value = state.inspector;
          }
          saveLocal(dateStr);
          renderAll();
        }
      }, (err) => {
        console.error("Snapshot error:", err);
        setSyncBadge("err", "即時監聽中斷");
      });
    }

    async function persistState() {
      state.updatedAt = `${nowTimeString()} (${state.inspector || "巡檢人員"})`;
      saveLocal(state.date);
      renderSummary();

      if (!state.cloudReady || !state.db) return;
      try {
        const docRef = doc(state.db, "artifacts", APP_ID, "public", "data", "areaInspections", state.date);
        await setDoc(docRef, {
          date: state.date,
          inspector: state.inspector,
          entries: state.entries,
          updatedAt: state.updatedAt
        }, { merge: true });
      } catch (err) {
        console.error("Save error:", err);
        showToast("雲端寫入失敗，已暫存本機");
      }
    }

    function isItemDone(entry) {
      if (!entry) return false;
      return Boolean(entry.checked) || Boolean((entry.note || "").trim());
    }

    function isItemIssue(entry) {
      return Boolean(entry && (entry.note || "").trim());
    }

    function getTabItems(tabName) {
      if (tabName === "全部區域") return CHECKLIST_ITEMS;
      return CHECKLIST_ITEMS.filter((it) => it.tab === tabName);
    }

    function getFilteredItems() {
      const q = (state.search || "").trim().toLowerCase();
      return getTabItems(state.activeTab).filter((it) => {
        const entry = state.entries[it.id];
        if (state.onlyIssue && !isItemIssue(entry)) return false;
        if (!q) return true;
        const hay = `${it.tab} ${it.area} ${it.category} ${it.item} ${entry?.note || ""}`.toLowerCase();
        return hay.includes(q);
      });
    }

    function renderTabs() {
      els.tabBar.innerHTML = "";
      TABS.forEach((tabName) => {
        const items = getTabItems(tabName);
        const doneCount = items.filter((it) => isItemDone(state.entries[it.id])).length;
        const issueCnt = items.filter((it) => isItemIssue(state.entries[it.id])).length;
        const active = state.activeTab === tabName;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-2.5 py-1 rounded-lg text-[11px] font-semibold whitespace-nowrap border transition shrink-0 ${
          active
            ? "bg-emerald-600 text-white border-emerald-600 shadow-2xs"
            : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
        }`;
        btn.textContent = issueCnt > 0
          ? `${tabName} (${doneCount}/${items.length}) · 異${issueCnt}`
          : `${tabName} (${doneCount}/${items.length})`;
        btn.addEventListener("click", () => {
          state.activeTab = tabName;
          renderAll();
        });
        els.tabBar.appendChild(btn);
      });
    }

    function renderSummary() {
      const totalDone = CHECKLIST_ITEMS.filter((it) => isItemDone(state.entries[it.id])).length;
      const tabItems = getTabItems(state.activeTab);
      const tabDone = tabItems.filter((it) => isItemDone(state.entries[it.id])).length;
      const totalIssues = CHECKLIST_ITEMS.filter((it) => isItemIssue(state.entries[it.id])).length;

      els.overallProgress.textContent = `${totalDone} / ${CHECKLIST_ITEMS.length}`;
      els.tabProgress.textContent = `${tabDone} / ${tabItems.length}`;
      els.issueCount.textContent = String(totalIssues);
      els.lastUpdated.textContent = state.updatedAt ? `更新 ${state.updatedAt}` : "尚未更新";
      renderTabs();
    }

    function renderItems() {
      const filtered = getFilteredItems();
      els.itemsContainer.innerHTML = "";

      if (filtered.length === 0) {
        els.itemsContainer.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-xl p-6 text-center text-xs text-slate-400">
            目前條件下沒有符合的巡檢項目
          </div>
        `;
        return;
      }

      const frag = document.createDocumentFragment();
      filtered.forEach((it) => {
        const entry = state.entries[it.id] || { checked: false, note: "" };
        const hasIssue = isItemIssue(entry);
        const done = isItemDone(entry);

        const row = document.createElement("div");
        row.className = `bg-white border rounded-xl p-2 flex flex-col sm:flex-row sm:items-center justify-between gap-2 transition ${
          hasIssue ? "border-rose-300 bg-rose-50/30" : done ? "border-emerald-200" : "border-slate-200"
        }`;

        const left = document.createElement("div");
        left.className = "flex items-start sm:items-center gap-2 min-w-0 flex-1";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = Boolean(entry.checked);
        cb.className = "mt-0.5 sm:mt-0 w-4 h-4 accent-emerald-600 rounded cursor-pointer shrink-0";
        cb.addEventListener("change", () => {
          state.entries[it.id] = {
            ...state.entries[it.id],
            checked: cb.checked,
            note: state.entries[it.id]?.note || ""
          };
          persistState();
          renderItems();
        });

        const textWrap = document.createElement("div");
        textWrap.className = "min-w-0 flex-1";

        const metaLine = document.createElement("div");
        metaLine.className = "flex flex-wrap items-center gap-1 text-[11px] text-slate-500";
        const areaBadge = it.area ? `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-medium">${escapeHtml(it.area)}</span>` : "";
        const catBadge = `<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold">${escapeHtml(it.category.replace(/\n/g, " "))}</span>`;
        metaLine.innerHTML = `${areaBadge}${catBadge}`;

        const itemTitle = document.createElement("div");
        itemTitle.className = `text-xs font-medium mt-0.5 break-words ${entry.checked && !hasIssue ? "text-slate-500 line-through" : "text-slate-800"}`;
        itemTitle.textContent = it.item;

        textWrap.appendChild(metaLine);
        textWrap.appendChild(itemTitle);
        left.appendChild(cb);
        left.appendChild(textWrap);

        const noteInput = document.createElement("input");
        noteInput.type = "text";
        noteInput.value = entry.note || "";
        noteInput.placeholder = "填寫異常或備註...";
        noteInput.className = `w-full sm:w-52 px-2.5 py-1 rounded-lg border text-xs focus:outline-none ${
          hasIssue
            ? "border-rose-300 bg-rose-50 text-rose-800 focus:border-rose-500"
            : "border-slate-200 bg-slate-50/70 text-slate-700 focus:border-emerald-500 focus:bg-white"
        }`;
        noteInput.addEventListener("input", () => {
          const val = noteInput.value;
          const prevChecked = Boolean(state.entries[it.id]?.checked);
          state.entries[it.id] = {
            checked: val.trim() ? true : prevChecked,
            note: val
          };
          saveLocal(state.date);
          renderSummary();
        });
        noteInput.addEventListener("change", () => {
          persistState();
          renderItems();
        });

        row.appendChild(left);
        if (it.shower) {
          const controls = document.createElement("div");
          controls.className = "flex flex-wrap gap-1 sm:justify-end";
          ["V 正常", "▲ 需更換", "● 髒污", "★ 破損", "清除"].forEach(label => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            const active = label === "V 正常" ? entry.checked && !hasIssue : label !== "清除" && (entry.note || "").includes(label);
            b.className = "px-2 py-1 rounded border text-xs " + (active ? "bg-emerald-600 text-white" : "bg-white text-slate-700");
            b.addEventListener("click", () => {
              const previous = state.entries[it.id]?.note || "";
              const extra = previous.replace(/^(?:(?:▲ 需更換|● 髒污|★ 破損) ?)+/, "").trim();
              if (label === "清除") state.entries[it.id] = {checked:false,note:""};
              else if (label === "V 正常") state.entries[it.id] = {checked:true,note:""};
              else {
                const flags = ["▲ 需更換", "● 髒污", "★ 破損"].filter(f => previous.includes(f));
                const next = flags.includes(label) ? flags.filter(f => f !== label) : [...flags,label];
                state.entries[it.id] = {checked:true,note:[...next,extra].filter(Boolean).join(" ")};
              }
              persistState(); renderItems();
            });
            controls.appendChild(b);
          });
          const right = document.createElement("div");
          right.className = "flex flex-col gap-1";
          right.appendChild(controls); right.appendChild(noteInput); row.appendChild(right);
        } else row.appendChild(noteInput);
        frag.appendChild(row);
      });

      els.itemsContainer.appendChild(frag);
    }

      renderSummary();
      renderItems();

      const rows = CHECKLIST_ITEMS.map((it) => {

        return [

          it.category.replace(/\n/g, " "),
          it.item,
          entry.checked ? "V" : "",
          entry.note || "",
          it.id
        ];
      });

      const csvContent = "\uFEFF" + [headers, ...rows]
        .map((r) => r.map((cell) => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `健身房區域巡檢_${state.date}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("已匯出 CSV");
    }

    els.dateInput.value = state.date;
    els.dateInput.addEventListener("change", () => {
      if (!els.dateInput.value) return;
      state.date = els.dateInput.value;
      subscribeDate(state.date);
    });

    els.inspectorInput.addEventListener("input", () => {
      state.inspector = els.inspectorInput.value;
      saveLocal(state.date);
    });
    els.inspectorInput.addEventListener("change", () => {
      state.inspector = els.inspectorInput.value.trim();
      persistState();
    });

    els.searchInput.addEventListener("input", () => {
      state.search = els.searchInput.value;
      renderItems();
    });

    els.onlyIssueBtn.addEventListener("click", () => {
      state.onlyIssue = !state.onlyIssue;
      els.onlyIssueBtn.className = state.onlyIssue
        ? "px-2.5 py-1.5 rounded-lg border border-rose-300 bg-rose-50 text-xs font-semibold text-rose-700 transition"
        : "px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition";
      renderItems();
    });

    els.checkAllTabBtn.addEventListener("click", () => {
      const targets = getTabItems(state.activeTab);
      targets.forEach((it) => {
        state.entries[it.id] = {
          checked: true,
          note: state.entries[it.id]?.note || ""
        };
      });
      persistState();
      renderItems();
      showToast(`已將「${state.activeTab}」全打 V`);
    });

    els.clearTabBtn.addEventListener("click", () => {
      const targets = getTabItems(state.activeTab);
      targets.forEach((it) => {
        state.entries[it.id] = { checked: false, note: "" };
      });
      persistState();
      renderItems();
      showToast(`已清除「${state.activeTab}」紀錄`);
    });

    els.exportCsvBtn.addEventListener("click", exportCsv);

    subscribeDate(state.date);
    initFirebase();
  </script>
</body>
</html>
